services:
  db:
    image: postgres:16
    container_name: bookera-db
    environment:
      POSTGRES_DB: ${DB_NAME:-bookera}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "5454:5454"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-bookera}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bookera-api
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bookera}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"

volumes:
  db-data: